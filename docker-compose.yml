version: "3.9"

services:
  db:
    image: postgres:15
    container_name: akiba_db
    environment:
      POSTGRES_DB: xxxxxxxx
      POSTGRES_USER: xxxxxxx
      POSTGRES_PASSWORD: xxxxxxxxxxxx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: akiba_redis
    ports:
      - "6379:6379"

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 akiba.asgi:application
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    volumes:
    - .:/app
  worker:
    build: .
    command: python manage.py runworker default
    depends_on:
      - redis
      - db
    volumes:
    - .:/app

volumes:
  postgres_data:
